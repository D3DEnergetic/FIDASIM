[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fidasim-python"
version = "0.1.0"
description = "FIDASIM Python preprocessing and EFIT utilities"
authors = [{name = "Juan F Caneses-Marin"}]
readme = "Readme.md"
requires-python = ">=3.8"

dependencies = [
    "numpy",
    "h5py",
    "scikit-image",
    "matplotlib",
    "scipy<1.11"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fidasim*", "efit*"]
